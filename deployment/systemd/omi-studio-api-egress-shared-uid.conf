# REVIEW-ONLY example. Do not install on production without a second SSH session,
# an IONOS backup, DNS/network inventory, test instance and rollback rehearsal.
#
# Applied to omi-studio-api.service ONLY (systemd cgroup socket filter), even
# when Plesk PHP-FPM sites share its Unix UID. Do NOT put these rules on
# system.slice, a Plesk unit, a UID-wide firewall or the whole host.
#
# This is deliberately PARTIAL protection: all public destinations and
# loopback (including local HTTP) remain accessible. This is NOT #765 acceptance.
# User-configured URLs still need connection-time public-address pinning.
#
# systemd filters BOTH ingress and egress for IPv4/IPv6; public nginx traffic,
# loopback API 3001 / collaboration 3022 and PostgreSQL 5432 must keep working.
# Private DNS resolvers may be blocked. Check /etc/resolv.conf before install.
[Service]
IPAddressAllow=localhost
IPAddressDeny=0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 169.254.0.0/16
IPAddressDeny=172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15
IPAddressDeny=224.0.0.0/4 240.0.0.0/4
IPAddressDeny=::/128 fc00::/7 fe80::/10 ff00::/8
IPAddressDeny=64:ff9b::/96 2001:db8::/32 2002::/16 3fff::/20
