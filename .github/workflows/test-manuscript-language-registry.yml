name: Test manuscript language registry

on:
  push:
    branches:
      - agent/po-localization-pipeline
    paths:
      - '.github/workflows/test-manuscript-language-registry.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/po-localization-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test manuscript language registry
        run: node --import tsx --test tests/manuscript-language.test.ts
      - name: Build Studio
        run: npm run build
