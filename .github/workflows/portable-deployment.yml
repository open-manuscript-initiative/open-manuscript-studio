name: Portable deployment

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "deployment/**"
      - "server/src/config/env.ts"
      - "server/src/collaboration/collaborationServer.ts"
      - ".github/workflows/portable-deployment.yml"
      - "package.json"
      - "package-lock.json"
      - "server/package.json"
      - "server/package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "deployment/**"
      - "server/src/config/env.ts"
      - "server/src/collaboration/collaborationServer.ts"
      - ".github/workflows/portable-deployment.yml"
      - "package.json"
      - "package-lock.json"
      - "server/package.json"
      - "server/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-and-image-build:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare validation environment
        run: cp deployment/.env.example deployment/.env
      - name: Validate Compose configuration
        run: docker compose --project-directory deployment -f deployment/compose.yml config --quiet
      - name: Build portable API and web images
        run: docker compose --project-directory deployment -f deployment/compose.yml build
