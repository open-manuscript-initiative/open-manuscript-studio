name: Regenerate server lockfile

on:
  push:
    branches:
      - fix/server-lockfile-sync

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/server-lockfile-sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Regenerate server package-lock
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync server package lockfile"
          git push origin HEAD:fix/server-lockfile-sync
