name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Upload the signed AAB to Google Play after building
        required: true
        type: boolean
        default: false
      play_track:
        description: Google Play testing track
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PACKAGE_NAME: org.openmanuscript.studio

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Rust Android targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk_home="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"

          if [[ -z "$android_home" || ! -d "$android_home" ]]; then
            echo 'Android SDK not found on the runner.' >&2
            exit 1
          fi

          if [[ -z "$ndk_home" || ! -f "$ndk_home/source.properties" ]]; then
            if [[ -d "$android_home/ndk" ]]; then
              ndk_home="$(find "$android_home/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
            fi
          fi

          if [[ -z "$ndk_home" || ! -f "$ndk_home/source.properties" ]]; then
            echo 'Android NDK not found on the runner.' >&2
            find "$android_home" -maxdepth 3 -type f -name source.properties -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

          echo "Using Android SDK: $android_home"
          echo "Using Android NDK: $ndk_home"
          grep '^Pkg.Revision' "$ndk_home/source.properties"

      - name: Generate Tauri Android project
        env:
          CI: 'true'
        run: |
          npm run tauri -- android init --ci
          npm run icons:generate

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/open-manuscript-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > src-tauri/gen/android/keystore.properties

          node scripts/configure-android-signing.mjs

      - name: Build signed Android App Bundle
        env:
          CI: 'true'
        run: npm run tauri -- android build --aab --ci

      - name: Build signed universal APK
        env:
          CI: 'true'
        run: npm run tauri -- android build --apk --ci

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: open-manuscript-studio-android-signed
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Validate Google Play credentials
        if: ${{ inputs.publish_to_play }}
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing required GitHub secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Upload AAB to Google Play
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          tracks: ${{ inputs.play_track }}
          status: completed
