name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Upload the signed AAB to Google Play after building
        required: true
        type: boolean
        default: false
      play_track:
        description: Google Play testing track
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PACKAGE_NAME: org.openmanuscript.studio
  GOOGLE_CLOUD_PROJECT_ID: open-manuscript-studio-508703
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Branch protection forbids mutating main from a workflow. The run number
      # makes each manually dispatched release version distinct in the build copy.
      - name: Set Android version code for this release run
        id: android_version
        env:
          ANDROID_VERSION_CODE_RUN_OFFSET: '1200'
        run: node scripts/prepare-android-version-code.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Android distribution
        run: |
          node --test tests/android-release-optimization.test.mjs
          node --test tests/android-agp9-test.test.mjs
          node --test tests/android-version-code.test.mjs
          npm run test:android-update
          python3 tests/verify-play-bundle.test.py
          python3 tests/android-page-size.test.py

      - name: Configure Rust Android targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$android_home" || ! -d "$android_home" ]]; then
            echo 'Android SDK not found on the runner.' >&2
            exit 1
          fi

          ndk_home="$android_home/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -f "$ndk_home/source.properties" ]]; then
            if ! command -v sdkmanager >/dev/null 2>&1; then
              echo 'sdkmanager is unavailable, so the pinned Android NDK cannot be installed.' >&2
              exit 1
            fi
            yes | sdkmanager "ndk;$ANDROID_NDK_VERSION" >/dev/null 2>&1 || true
          fi

          if [[ ! -f "$ndk_home/source.properties" ]]; then
            echo "Android NDK $ANDROID_NDK_VERSION was not installed at $ndk_home." >&2
            find "$android_home/ndk" -mindepth 1 -maxdepth 2 -name source.properties -print 2>/dev/null || true
            exit 1
          fi

          actual_ndk_version="$(sed -n 's/^Pkg.Revision[[:space:]]*=[[:space:]]*//p' "$ndk_home/source.properties" | head -n 1)"
          if [[ "$actual_ndk_version" != "$ANDROID_NDK_VERSION" ]]; then
            echo "Pinned Android NDK mismatch: expected $ANDROID_NDK_VERSION, found $actual_ndk_version." >&2
            exit 1
          fi

          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_home" >> "$GITHUB_ENV"

          echo "Using Android SDK: $android_home"
          echo "Using pinned Android NDK: $ndk_home"
          grep '^Pkg.Revision' "$ndk_home/source.properties"
          "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --version | head -n 1
          "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" --version | head -n 1

      - name: Generate Tauri Android project
        env:
          CI: 'true'
        run: |
          npm run tauri -- android init --ci
          node scripts/configure-android-modern-ui.mjs
          grep -nE 'ndkVersion|debugSymbolLevel' src-tauri/gen/android/app/build.gradle.kts
          npm run icons:generate

      - name: Configure AGP 9.0.1 production compatibility
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-android-agp9-test.mjs compatibility
          grep -n 'com.android.tools.build:gradle:9.0.1' src-tauri/gen/android/build.gradle.kts
          grep -n 'com.android.tools.build:gradle:9.0.1' src-tauri/gen/android/buildSrc/build.gradle.kts
          grep -n 'gradle-9.1.0-bin.zip' src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          grep -n 'android.r8.optimizedResourceShrinking=true' src-tauri/gen/android/gradle.properties

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/open-manuscript-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > src-tauri/gen/android/keystore.properties

          node scripts/configure-android-signing.mjs

      - name: Build signed Android App Bundle
        env:
          CI: 'true'
        run: npm run android:build:play

      - name: Verify Google Play bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          python3 scripts/verify-play-bundle.py "$RUNNER_TEMP/bundletool.jar"

      # verify-play-bundle.py copies the validated AAB into artifacts/play.
      - name: Verify embedded native debug symbols
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find artifacts/play -maxdepth 1 -type f -name '*.aab' -print -quit)"
          if [[ -z "$aab" ]]; then
            echo '::error::Signed Play AAB is missing from artifacts/play.'
            exit 1
          fi

          symbols="$(unzip -Z1 "$aab" | grep -E '^BUNDLE-METADATA/com\.android\.tools\.build\.debugsymbols/[^/]+/[^/]+\.(dbg|sym)$' || true)"
          if [[ -z "$symbols" ]]; then
            echo '::error::The AAB does not contain embedded native debug symbols.'
            echo 'Expected BUNDLE-METADATA/com.android.tools.build.debugsymbols/<abi>/*.dbg or *.sym.'
            unzip -Z1 "$aab" | grep -E '^(BUNDLE-METADATA|base/lib)/' || true
            exit 1
          fi

          echo 'Embedded native debug symbols:'
          printf '%s\n' "$symbols"

      - name: Verify 16 KB native libraries and Play packaging
        run: python3 scripts/verify-android-page-size.py artifacts/play --bundletool "$RUNNER_TEMP/bundletool.jar"

      - name: Build signed universal APK
        env:
          CI: 'true'
        run: npm run android:build:direct

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: open-manuscript-studio-android-signed
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/play/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Validate Google Play credentials
        if: ${{ inputs.publish_to_play }}
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing required GitHub secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"]
          expected_project = os.environ["GOOGLE_CLOUD_PROJECT_ID"]

          try:
              credentials = json.loads(raw)
          except json.JSONDecodeError as error:
              print(f"::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON: {error}")
              sys.exit(1)

          actual_project = credentials.get("project_id")
          if actual_project != expected_project:
              print(
                  "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON targets "
                  f"{actual_project!r}; expected canonical project {expected_project!r}."
              )
              sys.exit(1)

          for required_field in ("client_email", "private_key"):
              if not credentials.get(required_field):
                  print(
                      "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing "
                      f"required field: {required_field}"
                  )
                  sys.exit(1)

          print(f"Google Play credentials target canonical project: {actual_project}")
          PY

      - name: Upload AAB to Google Play
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: artifacts/play/*.aab
          tracks: ${{ inputs.play_track }}
          status: completed