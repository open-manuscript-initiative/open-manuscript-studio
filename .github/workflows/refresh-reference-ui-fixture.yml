name: Refresh reference fixture

on:
  push:
    branches:
      - test/reference-manuscript-ui-lifecycle

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fixture:reference-manuscript
      - name: Commit refreshed fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/reference-manuscript-all-features.omi.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: refresh reference fixture asset integrity"
          git push
