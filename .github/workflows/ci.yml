name: OMI Studio CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: omi-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: postgresql://omi_ci:omi_ci@localhost:5432/omi_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile PO locales
        run: npm run i18n:po:compile

      - name: Validate locale parity
        run: npm run i18n:validate-json

      - name: Audit PO translation completeness
        run: npm run i18n:po:audit

      - name: Verify generated runtime locales
        run: node scripts/verify-generated-runtime-locales.mjs

      - name: Run tests
        run: npm test

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma clients
        working-directory: server
        run: npm run prisma:generate:all

      - name: Typecheck server API
        working-directory: server
        run: npm run typecheck

      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Export build variables
        shell: bash
        run: |
          echo "VITE_APP_VERSION=${{ steps.package.outputs.version }}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VITE_COMMIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://studio.openmanuscript.org

    steps:
      - name: Set up Java for Android app-link certificate
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve Android signing certificate fingerprint
        id: android_app_link
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/omi-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          fingerprint="$(
            keytool -exportcert \
              -alias "$ANDROID_KEY_ALIAS" \
              -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -rfc |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2
          )"

          if [[ ! "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo 'Could not resolve the Android release certificate SHA-256 fingerprint.' >&2
            exit 1
          fi

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_REPOSITORY_TOKEN: ${{ github.token }}
        with:
          host: 85.215.185.85
          port: 22
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_REPOSITORY_TOKEN
          script: |
            set -euo pipefail

            export PATH="/var/www/vhosts/openmanuscript.org/.nodenv/shims:$PATH"

            cd /var/www/vhosts/openmanuscript.org/studio/repository

            COMMIT_SHA="${{ github.sha }}"

            if [[ -z "${DEPLOY_REPOSITORY_TOKEN:-}" ]]; then
              echo 'The short-lived GitHub deployment token is missing.' >&2
              exit 1
            fi

            REPOSITORY_URL='https://github.com/open-manuscript-initiative/open-manuscript-studio.git'
            GIT_AUTH_HEADER="$(
              printf 'x-access-token:%s' "$DEPLOY_REPOSITORY_TOKEN" |
                base64 |
                tr -d '\n'
            )"

            git remote set-url origin "$REPOSITORY_URL"
            GIT_TERMINAL_PROMPT=0 git \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GIT_AUTH_HEADER" \
              fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

            unset GIT_AUTH_HEADER DEPLOY_REPOSITORY_TOKEN

            if ! git merge-base --is-ancestor "$COMMIT_SHA" refs/remotes/origin/main; then
              echo "Deployment commit $COMMIT_SHA is not reachable from origin/main." >&2
              exit 1
            fi

            git reset --hard "$COMMIT_SHA"

            APP_VERSION="$(node -p "require('./package.json').version")"
            BUILD_NUMBER="${{ github.run_number }}"
            COMMIT_SHORT="${COMMIT_SHA:0:7}"
            BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

            export VITE_APP_VERSION="$APP_VERSION"
            export VITE_BUILD_NUMBER="$BUILD_NUMBER"
            export VITE_COMMIT_SHA="$COMMIT_SHORT"
            export VITE_BUILD_DATE="$BUILD_DATE"

            npm ci
            npm run i18n:po:compile
            npm run i18n:validate-json
            npm run i18n:po:audit
            npm test
            npm run build

            cd server
            npm ci
            npm run build
            npm run prisma:migrate:deploy
            npm run prisma:migrate:identity:deploy
            cd ..

            rsync -a --delete \
              dist/ \
              /var/www/vhosts/openmanuscript.org/studio/httpdocs/

            APP_LINK_ROOT=''
            for candidate in \
              /var/www/vhosts/openmanuscript.org/app/httpdocs \
              /var/www/vhosts/openmanuscript.org/app.openmanuscript.org \
              /var/www/vhosts/openmanuscript.org/subdomains/app/httpdocs
            do
              if [[ -d "$candidate" ]]; then
                APP_LINK_ROOT="$candidate"
                break
              fi
            done

            if [[ -z "$APP_LINK_ROOT" ]]; then
              echo 'Could not locate the app.openmanuscript.org Plesk document root.' >&2
              echo 'Checked the standard app/httpdocs, app.openmanuscript.org and subdomains/app/httpdocs locations.' >&2
              exit 1
            fi

            rsync -a --delete app-link-site/ "$APP_LINK_ROOT/"
            mkdir -p "$APP_LINK_ROOT/.well-known"
            cat > "$APP_LINK_ROOT/.well-known/assetlinks.json" <<'JSON'
            [
              {
                "relation": ["delegate_permission/common.handle_all_urls"],
                "target": {
                  "namespace": "android_app",
                  "package_name": "org.openmanuscript.studio",
                  "sha256_cert_fingerprints": [
                    "${{ steps.android_app_link.outputs.fingerprint }}"
                  ]
                }
              }
            ]
            JSON

            restart_api() {
              if systemctl restart omi-studio-api.service 2>/dev/null; then
                return 0
              fi
              if command -v sudo >/dev/null && sudo -n systemctl restart omi-studio-api.service; then
                return 0
              fi
              echo 'Unable to restart omi-studio-api.service with the deployment account.' >&2
              return 1
            }

            restart_api

            api_ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
                echo "API health check passed on attempt $attempt."
                api_ready=true
                break
              fi

              if ! systemctl is-active --quiet omi-studio-api.service; then
                echo 'omi-studio-api.service stopped while waiting for the health endpoint.' >&2
                systemctl status omi-studio-api.service --no-pager -l || true
                exit 1
              fi

              echo "API is not ready yet (attempt $attempt/30); retrying in 2 seconds..."
              sleep 2
            done

            if [[ "$api_ready" != 'true' ]]; then
              echo 'API health check did not become ready within 60 seconds.' >&2
              systemctl status omi-studio-api.service --no-pager -l || true
              exit 1
            fi

            assetlinks_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://app.openmanuscript.org/.well-known/assetlinks.json)"
            fallback_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://app.openmanuscript.org/auth/orcid/)"
            test "$assetlinks_status" = '200'
            test "$fallback_status" = '200'
