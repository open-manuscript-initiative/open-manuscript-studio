name: OMI Studio CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: omi-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: postgresql://omi_ci:omi_ci@localhost:5432/omi_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile PO locales
        run: npm run i18n:po:compile

      - name: Validate locale parity
        run: npm run i18n:validate-json

      - name: Audit PO translation completeness
        run: npm run i18n:po:audit

      - name: Verify generated runtime locales
        run: node scripts/verify-generated-runtime-locales.mjs

      - name: Run tests
        run: npm test

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma clients
        working-directory: server
        run: npm run prisma:generate:all

      - name: Typecheck server API
        working-directory: server
        run: npm run typecheck

      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Export build variables
        shell: bash
        run: |
          echo "VITE_APP_VERSION=${{ steps.package.outputs.version }}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VITE_COMMIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://studio.openmanuscript.org

    steps:
      - name: Set up Java for Android app-link certificate
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve Android signing certificate fingerprint
        id: android_app_link
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEY_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/omi-android-release.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          fingerprint="$(
            keytool -exportcert \
              -alias "$ANDROID_KEY_ALIAS" \
              -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -rfc |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2
          )"

          if [[ ! "$fingerprint" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo 'Could not resolve the Android release certificate SHA-256 fingerprint.' >&2
            exit 1
          fi

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 85.215.185.85
          port: 22
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            export PATH="/var/www/vhosts/openmanuscript.org/.nodenv/shims:$PATH"

            cd /var/www/vhosts/openmanuscript.org/studio/repository

            git fetch origin main
            git reset --hard origin/main

            APP_VERSION="$(node -p "require('./package.json').version")"
            BUILD_NUMBER="${{ github.run_number }}"
            COMMIT_SHA="${{ github.sha }}"
            COMMIT_SHORT="${COMMIT_SHA:0:7}"
            BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

            export VITE_APP_VERSION="$APP_VERSION"
            export VITE_BUILD_NUMBER="$BUILD_NUMBER"
            export VITE_COMMIT_SHA="$COMMIT_SHORT"
            export VITE_BUILD_DATE="$BUILD_DATE"

            npm ci
            npm run i18n:po:compile
            npm run i18n:validate-json
            npm run i18n:po:audit
            npm test
            npm run build

            cd server
            npm ci
            npm run build
            npm run prisma:migrate:deploy
            npm run prisma:migrate:identity:deploy
            cd ..

            rsync -a --delete \
              dist/ \
              /var/www/vhosts/openmanuscript.org/studio/httpdocs/

            APP_LINK_ASSET_FILE="$(
              find /var/www/vhosts/openmanuscript.org /var/www/vhosts/app.openmanuscript.org \
                -type f -path '*/.well-known/assetlinks.json' -print -quit 2>/dev/null || true
            )"
            APP_LINK_FALLBACK_FILE="$(
              find /var/www/vhosts/openmanuscript.org /var/www/vhosts/app.openmanuscript.org \
                -type f -path '*/auth/orcid/index.html' -print -quit 2>/dev/null || true
            )"

            if [[ -z "$APP_LINK_ASSET_FILE" || -z "$APP_LINK_FALLBACK_FILE" ]]; then
              echo 'Could not locate the prepared app.openmanuscript.org marker files.' >&2
              echo 'Expected .well-known/assetlinks.json and auth/orcid/index.html under the subdomain document root.' >&2
              exit 1
            fi

            APP_LINK_ROOT="$(dirname "$(dirname "$APP_LINK_ASSET_FILE")")"
            FALLBACK_ROOT="$(dirname "$(dirname "$(dirname "$APP_LINK_FALLBACK_FILE")")")"
            if [[ "$APP_LINK_ROOT" != "$FALLBACK_ROOT" ]]; then
              echo 'The prepared app-link files are not under the same document root.' >&2
              echo "assetlinks root: $APP_LINK_ROOT" >&2
              echo "fallback root: $FALLBACK_ROOT" >&2
              exit 1
            fi

            rsync -a app-link-site/ "$APP_LINK_ROOT/"
            cat > "$APP_LINK_ASSET_FILE" <<'JSON'
            [
              {
                "relation": ["delegate_permission/common.handle_all_urls"],
                "target": {
                  "namespace": "android_app",
                  "package_name": "org.openmanuscript.studio",
                  "sha256_cert_fingerprints": [
                    "${{ steps.android_app_link.outputs.fingerprint }}"
                  ]
                }
              }
            ]
            JSON

            restart_api() {
              if systemctl restart omi-studio-api.service 2>/dev/null; then
                return 0
              fi
              if command -v sudo >/dev/null && sudo -n systemctl restart omi-studio-api.service; then
                return 0
              fi
              echo 'Unable to restart omi-studio-api.service with the deployment account.' >&2
              return 1
            }

            restart_api
            systemctl is-active --quiet omi-studio-api.service
            curl --fail --silent --show-error http://127.0.0.1:3001/api/health >/dev/null

            assetlinks_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://app.openmanuscript.org/.well-known/assetlinks.json)"
            fallback_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://app.openmanuscript.org/auth/orcid/)"
            test "$assetlinks_status" = '200'
            test "$fallback_status" = '200'
