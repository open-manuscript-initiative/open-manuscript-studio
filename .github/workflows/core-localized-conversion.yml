name: Core localized metadata and conversion evidence
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/coreLocalizedConversionCases.ts'
      - 'tests/core-localized-conversion.test.ts'
      - 'tests/testManuscriptFixture.ts'
      - 'tests/*loader*'
      - 'scripts/verify-core-localized-conversion.ts'
      - 'package*.json'
      - '.github/workflows/core-localized-conversion.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localized-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core-localized-conversion
      - run: npm run evidence:core-localized-conversion -- --report test-results/core-localized-conversion.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-localized-conversion-evidence
          path: test-results/core-localized-conversion.json
          retention-days: 30
