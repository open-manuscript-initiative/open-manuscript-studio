name: Tauri Desktop Builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v0.1.0-alpha.2. Leave empty for build-only.'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'package.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/tauri-desktop.yml'

jobs:
  build-desktop:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
            artifact: linux-x86_64
          - platform: windows-latest
            args: '--bundles msi,nsis'
            artifact: windows-x86_64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            artifact: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            artifact: macos-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri application icons
        run: npm run tauri -- icon src-tauri/icons/icon.svg

      - name: Run frontend tests
        run: npm test

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: open-manuscript-studio-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || inputs.release_tag != '' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: open-manuscript-studio-*
          path: release-input

      - name: Prepare stable download filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_first() {
            local pattern="$1"
            local output="$2"
            local file
            file="$(find release-input -type f -name "$pattern" -print -quit)"
            if [ -z "$file" ]; then
              echo "Missing release asset matching $pattern" >&2
              exit 1
            fi
            cp "$file" "release-assets/$output"
          }

          copy_first '*.AppImage' 'Open-Manuscript-Studio-Linux-x64.AppImage'
          copy_first '*.deb' 'Open-Manuscript-Studio-Linux-x64.deb'
          copy_first '*.exe' 'Open-Manuscript-Studio-Windows-x64-Setup.exe'
          copy_first '*.msi' 'Open-Manuscript-Studio-Windows-x64.msi'

          arm_dmg="$(find release-input/open-manuscript-studio-macos-aarch64 -type f -name '*.dmg' -print -quit)"
          intel_dmg="$(find release-input/open-manuscript-studio-macos-x86_64 -type f -name '*.dmg' -print -quit)"
          test -n "$arm_dmg" && test -n "$intel_dmg"
          cp "$arm_dmg" 'release-assets/Open-Manuscript-Studio-macOS-Apple-Silicon.dmg'
          cp "$intel_dmg" 'release-assets/Open-Manuscript-Studio-macOS-Intel.dmg'

          ls -lh release-assets

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Open Manuscript Studio $RELEASE_TAG" \
              --generate-notes \
              --latest
          else
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F prerelease=false \
              -F draft=false \
              -f make_latest=true \
              >/dev/null
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
