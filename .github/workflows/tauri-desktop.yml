name: Tauri Builds and Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v0.1.0-alpha.3. Leave empty to use package.json version.'
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/tauri-desktop.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Desktop (${{ matrix.artifact }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
            artifact: linux-x86_64
          - platform: windows-latest
            args: '--bundles msi,nsis'
            artifact: windows-x86_64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            artifact: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            artifact: macos-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify locked Rust dependency graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1

      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: Generate Tauri application icons
        run: npm run tauri -- icon src-tauri/icons/icon.svg

      - name: Run frontend tests
        run: npm test

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: open-manuscript-studio-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error

  build-android:
    name: Android universal APK
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify locked Rust dependency graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1

      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: Generate Tauri application icons
        run: npm run tauri -- icon src-tauri/icons/icon.svg

      - name: Run frontend tests
        run: npm test

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk_home="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"

          if [[ -z "$android_home" || ! -d "$android_home" ]]; then
            echo 'Android SDK not found on the runner.' >&2
            exit 1
          fi

          if [[ -z "$ndk_home" || ! -f "$ndk_home/source.properties" ]]; then
            if [[ -d "$android_home/ndk" ]]; then
              ndk_home="$(
                find "$android_home/ndk" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                  -print \
                  | sort -V \
                  | tail -n 1
              )"
            fi
          fi

          if [[ -z "$ndk_home" || ! -f "$ndk_home/source.properties" ]]; then
            echo 'Android NDK not found on the runner.' >&2
            find "$android_home" -maxdepth 3 -type f -name source.properties -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

          echo "Using Android SDK: $android_home"
          echo "Using Android NDK: $ndk_home"
          grep '^Pkg.Revision' "$ndk_home/source.properties"

      - name: Initialize Android project
        env:
          CI: 'true'
        run: npm run tauri -- android init --ci

      - name: Build installable Android APK
        env:
          CI: 'true'
        run: npm run tauri -- android build --debug --apk --ci

      - name: Collect Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-artifact
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo 'No Android APK was produced.' >&2
            find src-tauri/gen/android/app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          cp "$apk" android-artifact/Open-Manuscript-Studio-Android-universal.apk
          ls -lh android-artifact

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: open-manuscript-studio-android
          path: android-artifact/Open-Manuscript-Studio-Android-universal.apk
          if-no-files-found: error

  publish-release:
    name: Publish downloadable builds
    needs:
      - build-desktop
      - build-android
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || inputs.release_tag != '' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: open-manuscript-studio-*
          path: release-input

      - name: Prepare stable download filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_first() {
            local pattern="$1"
            local output="$2"
            local file
            file="$(find release-input -type f -name "$pattern" -print -quit)"
            if [ -z "$file" ]; then
              echo "Missing release asset matching $pattern" >&2
              exit 1
            fi
            cp "$file" "release-assets/$output"
          }

          copy_first '*.AppImage' 'Open-Manuscript-Studio-Linux-x64.AppImage'
          copy_first '*.deb' 'Open-Manuscript-Studio-Linux-x64.deb'
          copy_first '*.exe' 'Open-Manuscript-Studio-Windows-x64-Setup.exe'
          copy_first '*.msi' 'Open-Manuscript-Studio-Windows-x64.msi'
          copy_first 'Open-Manuscript-Studio-Android-universal.apk' 'Open-Manuscript-Studio-Android-universal.apk'

          arm_dmg="$(find release-input/open-manuscript-studio-macos-aarch64 -type f -name '*.dmg' -print -quit)"
          intel_dmg="$(find release-input/open-manuscript-studio-macos-x86_64 -type f -name '*.dmg' -print -quit)"
          test -n "$arm_dmg" && test -n "$intel_dmg"
          cp "$arm_dmg" 'release-assets/Open-Manuscript-Studio-macOS-Apple-Silicon.dmg'
          cp "$intel_dmg" 'release-assets/Open-Manuscript-Studio-macOS-Intel.dmg'

          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Resolve release target
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          sanitize_tag() {
            local value="$1"
            value="$(printf '%s' "$value" | tr -d '\r\n\t ' )"
            printf '%s' "$value"
          }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$(sanitize_tag "${GITHUB_REF#refs/tags/}")"
            prerelease=false
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$(sanitize_tag "$INPUT_TAG")"
            prerelease=false
          else
            version="$(node -p "require('./package.json').version")"
            version="$(sanitize_tag "$version")"
            tag="v${version}"
            prerelease=true
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag resolved: '$tag'" >&2
            exit 1
          fi

          title="Open Manuscript Studio $tag"
          echo "Resolved release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$RELEASE_TITLE"
              --generate-notes
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh "${args[@]}"
          else
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_TITLE" \
              -F prerelease="$PRERELEASE" \
              -F draft=false \
              >/dev/null
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
