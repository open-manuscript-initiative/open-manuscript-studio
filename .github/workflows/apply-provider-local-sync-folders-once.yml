name: Apply provider-local sync folder updates once

on:
  push:
    branches:
      - feature/provider-local-sync-folders
    paths:
      - .github/workflows/apply-provider-local-sync-folders-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-local-sync-folders
          fetch-depth: 0

      - name: Update UI, docs and tests
        shell: python
        run: |
          from pathlib import Path

          component = Path('src/components/CloudStorageSettings.tsx')
          text = component.read_text()
          text = text.replace("  const desktopLocalFolder = platform === 'desktop';\n", '')
          text = text.replace(
              "  const [providerId, setProviderId] = useState<CloudStorageProviderId | ''>(\n"
              "    desktopLocalFolder ? 'local-folder' : '',\n"
              "  );",
              "  const [providerId, setProviderId] = useState<CloudStorageProviderId | ''>('');",
          )
          text = text.replace(
              "  const [connectionMethodId, setConnectionMethodId] = useState<CloudConnectionMethodId | ''>(\n"
              "    desktopLocalFolder ? 'local-folder' : '',\n"
              "  );",
              "  const [connectionMethodId, setConnectionMethodId] = useState<CloudConnectionMethodId | ''>('');",
          )
          text = text.replace(
              '<strong>{copy.localFolderMethod}</strong>',
              '<strong>{selectedProvider?.displayName} · {copy.localFolderMethod}</strong>',
          )
          component.write_text(text)

          docs = Path('docs/local-first-storage.md')
          doc_text = docs.read_text()
          marker = "## Security boundary\n"
          section = """## Cloud provider settings\n\nIn the desktop application, a locally synchronized folder is a **connection method of the actual cloud provider**, not a separate cloud service. For example, OneDrive, SharePoint, Google Drive, Dropbox, Nextcloud and iCloud Drive can use a folder that their installed desktop client already synchronizes.\n\nStudio remembers the selected folder locally per signed-in user, provider and account type. The path is not uploaded to the Studio API. Studio writes the portable OMI package into that folder, while the provider's own client remains responsible for authentication, conflict handling and cloud synchronization.\n\nWeb and mobile clients do not receive unrestricted filesystem access; they expose only connection methods available on those platforms.\n\n"""
          if section not in doc_text:
              doc_text = doc_text.replace(marker, section + marker)
              docs.write_text(doc_text)

          test_file = Path('tests/cloud-storage-providers.test.ts')
          test_file.write_text("""import assert from 'node:assert/strict';\nimport test from 'node:test';\n\nimport {\n  cloudStorageProviders,\n  getCloudConnectionMethods,\n  getDefaultCloudConnectionMethod,\n  type CloudAccountType,\n  type CloudStorageProviderId,\n} from '../src/integrations/cloudStorageProviders.ts';\n\ntest('locally synchronized folder is a provider method, not a provider entry', () => {\n  assert.equal(cloudStorageProviders.some((provider) => provider.id === 'local-folder'), false);\n});\n\nconst synchronizedProviders: Array<[CloudStorageProviderId, CloudAccountType]> = [\n  ['nextcloud', 'personal'],\n  ['onedrive', 'personal'],\n  ['sharepoint', 'business'],\n  ['google-drive', 'personal'],\n  ['dropbox', 'personal'],\n  ['icloud-drive', 'personal'],\n];\n\nfor (const [providerId, accountType] of synchronizedProviders) {\n  test(`${providerId} recommends its locally synchronized folder on desktop`, () => {\n    const methods = getCloudConnectionMethods(providerId, accountType, 'desktop');\n    const local = methods.find((method) => method.id === 'local-folder');\n    assert.ok(local);\n    assert.equal(local.available, true);\n    assert.equal(local.recommended, true);\n    assert.equal(getDefaultCloudConnectionMethod(providerId, accountType, 'desktop'), 'local-folder');\n  });\n}\n\ntest('plain WebDAV remains a direct connection without a local-folder method', () => {\n  const methods = getCloudConnectionMethods('webdav', 'personal', 'desktop');\n  assert.equal(methods.some((method) => method.id === 'local-folder'), false);\n  assert.equal(getDefaultCloudConnectionMethod('webdav', 'personal', 'desktop'), 'webdav');\n});\n\ntest('local provider folders are not filesystem-accessible from the hosted web Studio', () => {\n  const methods = getCloudConnectionMethods('onedrive', 'personal', 'web');\n  const local = methods.find((method) => method.id === 'local-folder');\n  assert.ok(local);\n  assert.equal(local.available, false);\n});\n\ntest('Nextcloud uses WebDAV as the available web default', () => {\n  assert.equal(getDefaultCloudConnectionMethod('nextcloud', 'personal', 'web'), 'webdav');\n});\n""")

          package = Path('package.json')
          package_text = package.read_text()
          old = 'tests/time-zones.test.ts tests/local-cloud-folder.test.ts"'
          new = 'tests/time-zones.test.ts tests/local-cloud-folder.test.ts tests/cloud-storage-providers.test.ts"'
          if old not in package_text:
              raise SystemExit('Could not locate test script insertion point')
          package.write_text(package_text.replace(old, new))

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/apply-provider-local-sync-folders-once.yml
          git add src/components/CloudStorageSettings.tsx docs/local-first-storage.md tests/cloud-storage-providers.test.ts package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate synchronized folders with cloud providers"
          git push origin HEAD:feature/provider-local-sync-folders
