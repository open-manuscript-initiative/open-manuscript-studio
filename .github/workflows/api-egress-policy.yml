name: Studio API egress-policy contracts (#765)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/egress/**'
      - 'tests/api-egress-policy.test.mjs'
      - 'tests/api-egress-shared-uid.test.ts'
      - 'deployment/systemd/omi-studio-api-egress-shared-uid.conf'
      - 'server/src/cloud/security/connectionPinnedHttp.ts'
      - 'server/src/cloud/providers/webdav/WebDavProvider.ts'
      - 'deployment/egress/**'
      - '.github/workflows/api-egress-policy.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/egress/**'
      - 'tests/api-egress-policy.test.mjs'
      - 'tests/api-egress-shared-uid.test.ts'
      - 'deployment/systemd/omi-studio-api-egress-shared-uid.conf'
      - 'server/src/cloud/security/connectionPinnedHttp.ts'
      - 'server/src/cloud/providers/webdav/WebDavProvider.ts'
      - 'deployment/egress/**'
      - '.github/workflows/api-egress-policy.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Validate API egress policy without installing it
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regression-test strict private/metadata and UID boundaries
        run: node --test tests/api-egress-policy.test.mjs
      - name: Test service-scoped shared-UID policy and connection-time DNS guard
        run: node --test --experimental-strip-types --import ./tests/register-ts-extension-loader.mjs tests/api-egress-shared-uid.test.ts
      - name: Offline systemd service-cgroup drop-in syntax validation
        shell: bash
        run: |
          set -euo pipefail
          # Feed only the staged IP directives to a synthetic oneshot unit.
          # systemd-analyze checks syntax without installing or activating it.
          {
            printf '[Unit]\\nDescription=OMI API egress syntax smoke\\n'
            printf '[Service]\\nType=oneshot\\nExecStart=/usr/bin/true\\n'
            grep '^IPAddress' deployment/systemd/omi-studio-api-egress-shared-uid.conf
          } > "$RUNNER_TEMP/omi-api-egress-smoke.service"
          systemd-analyze verify "$RUNNER_TEMP/omi-api-egress-smoke.service"
      - name: Offline nftables syntax validation (never apply)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          node --input-type=module <<'EOF' > "$RUNNER_TEMP/omi-api-egress-candidate.nft"
          import { renderPolicy } from './scripts/egress/generate-policy.mjs';
          process.stdout.write(renderPolicy({
            schemaVersion: 1, service: 'omi-studio-api.service', uid: 1500,
            localExceptions: [
              {address: '127.0.0.1', protocol: 'tcp', port: 5432},
              {address: '127.0.0.53', protocol: 'udp', port: 53},
              {address: '::1', protocol: 'tcp', port: 5432},
            ],
            outbound: [
              {cidr: '1.1.1.1/32', protocol: 'tcp', port: 443},
              {cidr: '2606:4700:4700::1111/128', protocol: 'tcp', port: 443},
            ],
          }));
          EOF
          # --check validates syntax; it never installs the rules into the runner.
          sudo nft --check --file "$RUNNER_TEMP/omi-api-egress-candidate.nft"
          echo "Offline nft syntax valid. Host firewall remains unchanged."
