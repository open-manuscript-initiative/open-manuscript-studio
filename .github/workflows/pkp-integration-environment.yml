name: PKP integration environment

on:
  workflow_dispatch:
    inputs:
      platform:
        description: PKP platform to exercise
        required: true
        default: both
        type: choice
        options:
          - both
          - ojs
          - omp
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pkp-integration-environment.yml
      - docs/pkp-integration-test-environment.md
      - docs/release/ojs-3.5-stable-acceptance.md
      - package.json
      - package-lock.json
      - playwright.pkp.config.ts
      - server/**
      - tests/pkp-integration/**
      - tests/pkp-integration-environment.test.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/pkp-integration-environment.yml
      - docs/pkp-integration-test-environment.md
      - docs/release/ojs-3.5-stable-acceptance.md
      - package.json
      - package-lock.json
      - playwright.pkp.config.ts
      - server/**
      - tests/pkp-integration/**
      - tests/pkp-integration-environment.test.ts

permissions:
  contents: read

concurrency:
  group: pkp-integration-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: true

jobs:
  select-targets:
    name: Select PKP acceptance targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Build acceptance matrix
        id: matrix
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform || 'both' }}
        shell: bash
        run: |
          case "$REQUESTED_PLATFORM" in
            ojs)
              targets='[
                {"platform":"ojs","version":"3_5_0-4","release_tier":"stable"},
                {"platform":"ojs","version":"3_5_0-5","release_tier":"stable"}
              ]'
              ;;
            omp)
              targets='[
                {"platform":"omp","version":"3_5_0-4","release_tier":"preview"}
              ]'
              ;;
            both)
              targets='[
                {"platform":"ojs","version":"3_5_0-4","release_tier":"stable"},
                {"platform":"ojs","version":"3_5_0-5","release_tier":"stable"},
                {"platform":"omp","version":"3_5_0-4","release_tier":"preview"}
              ]'
              ;;
            *)
              echo "Unsupported platform: $REQUESTED_PLATFORM" >&2
              exit 1
              ;;
          esac
          targets="$(printf '%s' "$targets" | tr -d '\n' | tr -s ' ')"
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"

  workflow-e2e:
    name: ${{ matrix.target.platform }} ${{ matrix.target.version }} (${{ matrix.target.release_tier }}) workflow E2E
    needs: select-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-targets.outputs.targets) }}
    env:
      PKP_VERSION: ${{ matrix.target.version }}
      PKP_RELEASE_TIER: ${{ matrix.target.release_tier }}

    steps:
      - name: Checkout Studio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Studio test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Checkout matching integration plugin
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.target.platform == 'ojs' && 'open-manuscript-initiative/omi-ojs-plugin' || 'open-manuscript-initiative/omi-omp-plugin' }}
          ref: main
          path: tests/pkp-integration/runtime/plugin
          persist-credentials: false

      - name: Validate Compose configuration
        run: npm run pkp:config -- ${{ matrix.target.platform }} > /tmp/pkp-compose.yml

      - name: Start integration environment
        run: npm run pkp:up -- ${{ matrix.target.platform }}

      - name: Verify service and plugin boundaries
        run: npm run pkp:verify -- ${{ matrix.target.platform }}

      - name: Run Playwright workflow tests
        run: npm run pkp:test -- ${{ matrix.target.platform }}

      - name: Collect container diagnostics
        if: ${{ always() && !cancelled() }}
        run: npm run pkp:logs -- ${{ matrix.target.platform }}

      - name: Upload diagnostics and acceptance evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pkp-${{ matrix.target.platform }}-${{ matrix.target.version }}-${{ matrix.target.release_tier }}-diagnostics-${{ github.run_attempt }}
          path: |
            tests/pkp-integration/runtime/logs/
            tests/pkp-integration/runtime/fixture-*.json
            tests/pkp-integration/runtime/acceptance-*.json
            playwright-report/pkp-${{ matrix.target.platform }}-${{ matrix.target.version }}/
            test-results/pkp-${{ matrix.target.platform }}-${{ matrix.target.version }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop integration environment
        if: ${{ always() }}
        run: npm run pkp:down -- ${{ matrix.target.platform }}
