name: Windows MSIX candidates (Microsoft Store)

# Additive, manually dispatched candidate workflow. Does not publish GitHub releases
# and does not change the exact-SHA 1.0 RC acceptance/release contract.
# Keep this Store-only: GitHub checks action policy before job conditions,
# so even a skipped third-party signing action can block the entire run.
on:
  workflow_dispatch:
    inputs:
      msix_identity:
        description: 'Exact reserved package Identity Name (use the same immutable name for updates)'
        type: string
        required: true
        default: 'VargaIstvn.OpenManuscriptStudio'
      msix_publisher:
        description: 'Exact Partner Center Publisher (distinguished name)'
        type: string
        required: true
        default: 'CN=ED26F194-9F12-45EE-A4BC-C7DCD3A00E83'
      msix_publisher_display_name:
        description: 'Exact Package/Properties/PublisherDisplayName from Partner Center'
        type: string
        required: true
        default: 'Varga István'

permissions:
  contents: read

concurrency:
  group: windows-msix-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-msix:
    if: github.repository == 'open-manuscript-initiative/open-manuscript-studio' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify locked Rust graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1
      - name: Run package identity and manifest checks
        run: node --test tests/windows-msix-packaging.test.mjs
      - name: Generate native icons
        run: npm run icons:generate
      - name: Compile Tauri Windows executable (no MSI/NSIS bundle)
        run: npm run tauri -- build --no-bundle --ci
      - name: Stage and pack unsigned MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY: ${{ inputs.msix_identity }}
          MSIX_PUBLISHER: ${{ inputs.msix_publisher }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ inputs.msix_publisher_display_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/build-windows-msix.mjs 'src-tauri/target/release/open-manuscript-studio.exe' 'msix-stage' "$env:MSIX_IDENTITY" "$env:MSIX_PUBLISHER" "$env:MSIX_PUBLISHER_DISPLAY_NAME"
          if ($LASTEXITCODE -ne 0) { throw "MSIX staging failed ($LASTEXITCODE)." }
          ./scripts/pack-windows-msix.ps1 -ContentRoot 'msix-stage' -OutputFile 'msix-artifacts/Open-Manuscript-Studio-Windows-x64.msix'
          Get-FileHash 'msix-artifacts/Open-Manuscript-Studio-Windows-x64.msix' -Algorithm SHA256 | Format-List
      - name: Store submission candidate (not installable until Store signs)
        uses: actions/upload-artifact@v7
        with:
          name: omi-studio-windows-msix-store-unsigned
          path: msix-artifacts/*.msix
          if-no-files-found: error
