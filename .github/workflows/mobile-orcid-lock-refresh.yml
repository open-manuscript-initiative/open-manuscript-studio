name: Refresh mobile ORCID lockfiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/mobile-orcid-deep-link'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-orcid-deep-link

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh Cargo lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Verify npm install
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Commit refreshed lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git commit -m "Refresh mobile ORCID lockfiles"
          git push origin HEAD:fix/mobile-orcid-deep-link
