name: iOS Simulator Smoke Build

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - '.github/workflows/ios-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # v2 intentionally bypasses any stale concurrency group left behind by a
  # GitHub Actions run that could not be cancelled.
  group: ios-simulator-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iPhone / iPad simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Simulator builds do not use this identity for distribution signing, but
      # Tauri/Xcode project generation requires a syntactically present team.
      # Real device/App Store builds use the actual APPLE_DEVELOPMENT_TEAM in
      # the separate manual release workflow.
      APPLE_DEVELOPMENT_TEAM: '0000000000'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Rust iOS targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios-sim x86_64-apple-ios

      - name: Ensure CocoaPods is available
        shell: bash
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Generate iOS project and icons
        run: |
          npm run icons:generate
          rm -rf src-tauri/gen/apple src-tauri/gen/ios
          npm run tauri -- ios init

      - name: Build Apple Silicon simulator app
        run: npm run tauri -- ios build --target aarch64-sim --debug

      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: open-manuscript-studio-ios-simulator
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/gen/apple/build/arm64-sim/*.app
            src-tauri/gen/ios/build/arm64-sim/*.app
