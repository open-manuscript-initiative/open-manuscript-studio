name: Prepare beta.4 lock metadata

on:
  push:
    branches:
      - release/beta4-immutable

permissions:
  contents: write

jobs:
  sync-lock-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/beta4-immutable

      - name: Synchronize root package versions without dependency upgrades
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = pkg.version;

          const npmLockPath = 'package-lock.json';
          const npmLock = JSON.parse(fs.readFileSync(npmLockPath, 'utf8'));
          npmLock.version = version;
          if (!npmLock.packages || !npmLock.packages['']) {
            throw new Error('package-lock.json does not contain the root package entry');
          }
          npmLock.packages[''].version = version;
          fs.writeFileSync(npmLockPath, `${JSON.stringify(npmLock, null, 2)}\n`);

          const cargoLockPath = 'src-tauri/Cargo.lock';
          const cargoLock = fs.readFileSync(cargoLockPath, 'utf8');
          const pattern = /(\[\[package\]\]\nname = "open-manuscript-studio"\nversion = ")[^"]+("\n)/;
          if (!pattern.test(cargoLock)) {
            throw new Error('Cargo.lock does not contain the Studio root package entry');
          }
          const nextCargoLock = cargoLock.replace(pattern, `$1${version}$2`);
          fs.writeFileSync(cargoLockPath, nextCargoLock);
          NODE

      - name: Commit synchronized lock metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lock metadata already synchronized.'
            exit 0
          fi
          git commit -m 'Sync lockfile metadata for v0.1.0-beta.4'
          git push origin HEAD:release/beta4-immutable
