name: Core extension and vocabulary preservation evidence
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/coreExtensionCases.ts'
      - 'tests/core-extension.test.ts'
      - 'tests/testManuscriptFixture.ts'
      - 'tests/*loader*'
      - 'scripts/verify-core-extensions.ts'
      - 'package*.json'
      - '.github/workflows/core-extensions.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core-extensions
      - run: npm run evidence:core-extensions -- --report test-results/core-extensions.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-extensions-evidence
          path: test-results/core-extensions.json
          retention-days: 30
