name: Generate reference manuscript fixture

on:
  push:
    branches:
      - test/reference-manuscript-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical reference manuscript
        run: npm run fixture:reference-manuscript

      - name: Commit fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/reference-manuscript-all-features.omi.json
          if git diff --cached --quiet; then
            echo "Reference fixture already up to date."
            exit 0
          fi
          git commit -m "test: generate canonical reference manuscript fixture"
          git push
