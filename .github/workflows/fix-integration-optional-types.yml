name: Repair integration optional types

on:
  push:
    branches:
      - feature/complete-integrations-framework

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-integrations-framework
      - name: Repair exact optional property contracts
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('server/src/integrations/integrationExecution.ts'): [
                  ('  id?: string;\n', '  id?: string | undefined;\n'),
                  ('  reviewConfidential?: boolean;\n', '  reviewConfidential?: boolean | undefined;\n'),
                  ('  kind?: string;\n', '  kind?: string | undefined;\n'),
                  ('  sourceLanguage?: string;\n', '  sourceLanguage?: string | undefined;\n'),
                  ("  formality?: 'default' | 'more' | 'less' | 'prefer_more' | 'prefer_less';\n", "  formality?: 'default' | 'more' | 'less' | 'prefer_more' | 'prefer_less' | undefined;\n"),
                  ('  allowReviewConfidential?: boolean;\n', '  allowReviewConfidential?: boolean | undefined;\n'),
                  ('  detectedSourceLanguage?: string;\n', '  detectedSourceLanguage?: string | undefined;\n'),
                  ('  context?: Record<string, unknown>;\n', '  context?: Record<string, unknown> | undefined;\n'),
                  ('  requestedPermissions?: string[];\n', '  requestedPermissions?: string[] | undefined;\n'),
                  ('  allowDirectWrite?: boolean;\n', '  allowDirectWrite?: boolean | undefined;\n'),
                  ('  model?: string;\n', '  model?: string | undefined;\n'),
                  ('  secret?: string;\n', '  secret?: string | undefined;\n'),
              ],
              Path('src/services/integrationExecutionApi.ts'): [
                  ('  id?: string;\n', '  id?: string | undefined;\n'),
                  ('  reviewConfidential?: boolean;\n', '  reviewConfidential?: boolean | undefined;\n'),
                  ('  kind?: string;\n', '  kind?: string | undefined;\n'),
                  ('  sourceLanguage?: string;\n', '  sourceLanguage?: string | undefined;\n'),
                  ("  formality?: 'default' | 'more' | 'less' | 'prefer_more' | 'prefer_less';\n", "  formality?: 'default' | 'more' | 'less' | 'prefer_more' | 'prefer_less' | undefined;\n"),
                  ('  allowReviewConfidential?: boolean;\n', '  allowReviewConfidential?: boolean | undefined;\n'),
                  ('  detectedSourceLanguage?: string;\n', '  detectedSourceLanguage?: string | undefined;\n'),
                  ('  context?: Record<string, unknown>;\n', '  context?: Record<string, unknown> | undefined;\n'),
                  ('  requestedPermissions?: string[];\n', '  requestedPermissions?: string[] | undefined;\n'),
                  ('  allowDirectWrite?: boolean;\n', '  allowDirectWrite?: boolean | undefined;\n'),
                  ('  model?: string;\n', '  model?: string | undefined;\n'),
                  ('  description?: string;\n', '  description?: string | undefined;\n'),
                  ('  endpoints?: Record<string, string>;\n', '  endpoints?: Record<string, string> | undefined;\n'),
                  ('  sourceLocale?: string;\n', '  sourceLocale?: string | undefined;\n'),
                  ("  scope: { kind: 'section' | 'manuscript'; id?: string };\n", "  scope: { kind: 'section' | 'manuscript'; id?: string | undefined };\n"),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              original = text
              for old, new in edits:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No expected optional-property replacements applied to {path}')
              path.write_text(text)

      - name: Commit repaired contracts
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/integrations/integrationExecution.ts src/services/integrationExecutionApi.ts
          git commit -m "Fix exact optional integration contracts"
          git push origin HEAD:feature/complete-integrations-framework
