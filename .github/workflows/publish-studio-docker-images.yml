name: Publish Studio Docker images

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish API and web images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/open-manuscript-initiative/open-manuscript-studio-api:latest
            ghcr.io/open-manuscript-initiative/open-manuscript-studio-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/open-manuscript-initiative/open-manuscript-studio

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/open-manuscript-initiative/open-manuscript-studio-web:latest
            ghcr.io/open-manuscript-initiative/open-manuscript-studio-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/open-manuscript-initiative/open-manuscript-studio
