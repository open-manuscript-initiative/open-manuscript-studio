name: Temporary Tauri lockfile update

on:
  push:
    branches:
      - feat/persist-local-sync-folder
    paths:
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/update-tauri-lock-temp.yml'

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/persist-local-sync-folder

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate locked dependency graph
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo 'Cargo.lock already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'Update Tauri dependency lockfile'
          git push origin HEAD:feat/persist-local-sync-folder
