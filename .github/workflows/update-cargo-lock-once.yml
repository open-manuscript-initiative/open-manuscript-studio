name: Update Cargo lock once

on:
  push:
    branches:
      - fix/android-orcid-custom-tabs
    paths:
      - .github/workflows/update-cargo-lock-once.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/android-orcid-custom-tabs
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: update Cargo lockfile for auth browser plugin"
          git push origin HEAD:fix/android-orcid-custom-tabs
