name: Apply desktop outline integration once

on:
  push:
    branches:
      - feature/desktop-fullscreen-menus-outline
    paths:
      - .github/workflows/apply-desktop-outline-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/desktop-fullscreen-menus-outline
          fetch-depth: 0

      - name: Integrate desktop outline and mobile-only structure menu
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          import_anchor = "import { DesktopUpdatePrompt } from './components/DesktopUpdatePrompt';\n"
          import_line = "import { DesktopDocumentOutline } from './components/DesktopDocumentOutline';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('DesktopUpdatePrompt import anchor not found')
              text = text.replace(import_anchor, import_line + import_anchor)

          state_anchor = "  const [menuOpen, setMenuOpen] = useState(false);\n"
          state_line = "  const [outlineOpen, setOutlineOpen] = useState(false);\n"
          if state_line not in text:
              if state_anchor not in text:
                  raise SystemExit('menuOpen state anchor not found')
              text = text.replace(state_anchor, state_anchor + state_line)

          old_return = '''  return (\n    <AppLayout onOpenMenu={() => setMenuOpen(true)}>\n      <div className="focus-workspace"><EditorPane ojsContributors={ojsContributors} /></div>\n      <SearchReplaceOverlay />\n      <DesktopUpdatePrompt />\n      <StudioMenuWithHelp\n        open={menuOpen}\n        onClose={() => setMenuOpen(false)}\n        ojsAssignment={ojsAssignment}\n      />\n    </AppLayout>\n  );'''
          new_return = '''  return (\n    <AppLayout\n      onOpenMenu={() => setMenuOpen(true)}\n      outlineOpen={outlineOpen}\n      onToggleOutline={() => setOutlineOpen((current) => !current)}\n    >\n      <div className={`focus-workspace${outlineOpen ? ' focus-workspace--outline' : ''}`}>\n        {outlineOpen ? (\n          <DesktopDocumentOutline onClose={() => setOutlineOpen(false)} />\n        ) : null}\n        <EditorPane ojsContributors={ojsContributors} />\n      </div>\n      <SearchReplaceOverlay />\n      <DesktopUpdatePrompt />\n      <StudioMenuWithHelp\n        open={menuOpen}\n        onClose={() => setMenuOpen(false)}\n        ojsAssignment={ojsAssignment}\n      />\n    </AppLayout>\n  );'''
          if old_return not in text:
              raise SystemExit('Desktop AppLayout return block not found')
          text = text.replace(old_return, new_return)
          app.write_text(text)

          menu = Path('src/components/StudioMenu.tsx')
          text = menu.read_text()
          old_structure = '    <SectionStructurePanel onNavigate={onNavigate} />\n'
          new_structure = '''    <div className="studio-menu-mobile-structure">\n      <SectionStructurePanel onNavigate={onNavigate} />\n    </div>\n'''
          if new_structure not in text:
              if old_structure not in text:
                  raise SystemExit('SectionStructurePanel anchor not found')
              text = text.replace(old_structure, new_structure)
          menu.write_text(text)
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/StudioMenu.tsx
          git commit -m "feat: integrate desktop outline navigation"
          git push origin HEAD:feature/desktop-fullscreen-menus-outline
