name: Apply Czech PO translation

on:
  push:
    branches:
      - agent/po-localization-pipeline
    paths:
      - '.github/workflows/apply-cs-po-translation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/po-localization-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Czech module translations
        run: |
          git fetch origin agent/unified-i18n-all
          git show origin/agent/unified-i18n-all:scripts/i18n-module-translations/cs.json > /tmp/cs.json
      - name: Seed Czech core translations missing from legacy module dictionary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'locale/pending/cs.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const translations = {
            '/navigation/editor': 'Editor',
            '/navigation/metadata': 'Metadata',
            '/citations/creatorRole': 'Role',
            '/citations/prefix': 'Prefix',
            '/citations/roles/editor': 'Editor',
            '/citations/resourceTypes/preprint': 'Preprint',
            '/citations/resourceTypes/software': 'Software',
            '/citations/locators/folio': 'Folio',
            '/contributors/roles/editor': 'Editor',
            '/contributors/roles/software': 'Software'
          };
          let filled = 0;
          for (const e of data.entries) {
            if (Object.prototype.hasOwnProperty.call(translations, e.key)) {
              e.translation = translations[e.key];
              filled++;
            }
          }
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
          console.log(`Seeded ${filled} Czech core translations.`);
          NODE
      - name: Fill pending Czech translations
        run: node scripts/fill-pending-from-legacy-module-translations.mjs --locale=cs --legacy=/tmp/cs.json
      - run: node scripts/apply-pending-po-translations.mjs --locale=cs
      - run: npm run i18n:po:compile
      - run: npm run i18n:validate-json
      - run: npm run i18n:po:audit
      - run: node scripts/export-pending-po-translations.mjs --locale=cs
      - name: Show residual candidates
        run: node -e "const p=require('./locale/pending/cs.json'); console.log('Czech residual:',p.pendingCount); for(const e of p.entries) console.log(e.key,'=>',JSON.stringify(e.source));"
      - name: Commit Czech catalogs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locale/cs/studio.po locale/pending/cs.json src/i18n/locales/cs/studio.json
          git commit -m 'Apply Czech PO translations [skip ci]' || exit 0
          git push origin HEAD:agent/po-localization-pipeline
