name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Match the Java bundle selected by the linked CodeQL v4 action.
      CODEQL_JAVA_BUNDLE_VERSION: '2.27.4'
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache CodeQL Java bundle
        if: matrix.language == 'java-kotlin'
        id: java-bundle
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/codeql-bundle-java-linux64.tar.zst
          key: codeql-java-linux64-${{ env.CODEQL_JAVA_BUNDLE_VERSION }}

      - name: Download CodeQL Java bundle with bounded retries
        if: matrix.language == 'java-kotlin' && steps.java-bundle.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/codeql-bundle-java-linux64.tar.zst"
          url="https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_JAVA_BUNDLE_VERSION}/codeql-bundle-java-linux64.tar.zst"
          curl --fail --location --retry 5 --retry-delay 10 --retry-max-time 480 \
            --retry-connrefused --connect-timeout 30 --max-time 180 \
            --output "$bundle.partial" "$url"
          tar --zstd -tf "$bundle.partial" >/dev/null
          mv "$bundle.partial" "$bundle"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: ${{ matrix.language == 'java-kotlin' && format('{0}/codeql-bundle-java-linux64.tar.zst', runner.temp) || '' }}

      - name: Set up Node.js for Android build
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for Android build
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Rust with Android targets
        if: matrix.language == 'java-kotlin'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust Android build
        if: matrix.language == 'java-kotlin'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        if: matrix.language == 'java-kotlin'
        run: npm ci

      - name: Configure Android SDK and NDK
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail

          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk_home="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"

          if [[ -z "$android_home" || ! -d "$android_home" ]]; then
            echo 'Android SDK not found on the runner.' >&2
            exit 1
          fi

          if [[ -z "$ndk_home" || ! -f "$ndk_home/source.properties" ]]; then
            if [[ -d "$android_home/ndk" ]]; then
              ndk_home="$(find "$android_home/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
            fi
          fi

          if [[ -z "$ndk_home" || ! -f "$ndk_home/source.properties" ]]; then
            echo 'Android NDK not found on the runner.' >&2
            exit 1
          fi

          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Initialize Tauri Android project
        if: matrix.language == 'java-kotlin'
        env:
          CI: 'true'
        run: npm run tauri -- android init --ci

      - name: Configure Android modern UI
        if: matrix.language == 'java-kotlin'
        run: node scripts/configure-android-modern-ui.mjs

      - name: Generate Android launcher icons
        if: matrix.language == 'java-kotlin'
        run: npm run icons:generate

      - name: Build Android code for CodeQL
        if: matrix.language == 'java-kotlin'
        env:
          CI: 'true'
        run: npm run tauri -- android build --debug --apk --ci

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
