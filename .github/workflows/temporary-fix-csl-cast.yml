name: Temporary CSL cast fix

on:
  push:
    paths:
      - '.github/workflows/temporary-fix-csl-cast.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix strict TypeScript assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/model/cslRendering.ts')
          s = p.read_text()
          old = "  }) as CslJsonItem;"
          new = "  }) as unknown as CslJsonItem;"
          if old not in s:
              raise SystemExit('target assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/model/cslRendering.ts
          git commit -m 'Fix CSL JSON strict TypeScript assertion'
          git push
