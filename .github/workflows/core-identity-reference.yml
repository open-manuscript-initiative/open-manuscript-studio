name: Core identity and reference evidence
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/coreIdentityReferenceCases.ts'
      - 'tests/core-identity-reference.test.ts'
      - 'tests/testManuscriptFixture.ts'
      - 'tests/*loader*'
      - 'scripts/verify-core-identity-references.ts'
      - 'package*.json'
      - '.github/workflows/core-identity-reference.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core-identity
      - run: npm run evidence:core-identity -- --report test-results/core-identity-reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-identity-reference-evidence
          path: test-results/core-identity-reference.json
          retention-days: 30
