name: Apply completed PO translations

on:
  push:
    branches:
      - agent/po-localization-pipeline
    paths:
      - '.github/workflows/apply-po-pending.yml'
      - 'locale/pending/hu.json'
      - 'locale/pending/de.json'
      - 'locale/translation-status.json'
      - 'scripts/audit-po-locales.mjs'
      - 'scripts/compile-po-locales-to-json.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/po-localization-pipeline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Hungarian pending translations
        run: node scripts/apply-pending-po-translations.mjs --locale=hu

      - name: Apply German pending translations
        run: node scripts/apply-pending-po-translations.mjs --locale=de

      - name: Compile PO catalogs to runtime JSON
        run: npm run i18n:po:compile

      - name: Validate JSON locale parity
        run: npm run i18n:validate-json

      - name: Audit PO completeness
        run: npm run i18n:po:audit

      - name: Commit generated catalogs
        shell: bash
        run: |
          if git diff --quiet -- locale/hu/studio.po locale/de/studio.po src/i18n/locales/hu/studio.json src/i18n/locales/de/studio.json; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locale/hu/studio.po locale/de/studio.po src/i18n/locales/hu/studio.json src/i18n/locales/de/studio.json
          git commit -m 'Apply completed Hungarian and German PO translations [skip ci]'
          git push origin HEAD:agent/po-localization-pipeline
