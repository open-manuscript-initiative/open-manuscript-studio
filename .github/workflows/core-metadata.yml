name: Core metadata evidence
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/coreMetadataCases.ts'
      - 'tests/core-metadata.test.ts'
      - 'tests/testManuscriptFixture.ts'
      - 'tests/*loader*'
      - 'scripts/verify-core-metadata.ts'
      - 'package*.json'
      - '.github/workflows/core-metadata.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core-metadata
      - run: npm run evidence:core-metadata -- --report test-results/core-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-metadata-evidence
          path: test-results/core-metadata.json
          retention-days: 30
