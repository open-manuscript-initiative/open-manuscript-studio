version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    ignore:
      # RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g
      # glib 0.18.5 is pulled transitively by Tauri's Linux GTK/WebKit stack.
      # Tauri 2.11.5 still depends on gtk/webkit2gtk releases that require
      # glib 0.18.x, so Dependabot cannot resolve glib >= 0.20.0 on its own.
      # Keep the alert visible in Security and remove this ignore as soon as
      # upstream Tauri/gtk/webkit2gtk moves to a non-vulnerable glib series.
      - dependency-name: "glib"
        versions:
          - "0.18.5"
