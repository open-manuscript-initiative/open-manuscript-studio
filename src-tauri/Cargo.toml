[package]
name = "open-manuscript-studio"
version = "0.1.0-alpha.1"
description = "Open Manuscript Studio desktop shell"
authors = ["Open Manuscript Initiative"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "open_manuscript_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
