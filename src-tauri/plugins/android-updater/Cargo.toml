[package]
name = "tauri-plugin-android-updater"
version = "0.1.0"
description = "Android-native APK updater handoff for Open Manuscript Studio"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-android-updater"
build = "build.rs"

[package.metadata.platforms.support]
windows = { level = "none" }
linux = { level = "none" }
macos = { level = "none" }
android = { level = "full" }
ios = { level = "none" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"
