[package]
name = "tauri-plugin-deep-link"
version = "2.6.2"
description = "Set your Tauri application as the default handler for a URL"
authors = ["Open Manuscript Initiative"]
license = "Apache-2.0 OR MIT"
edition = "2021"
rust-version = "1.77"
repository = "https://github.com/tauri-apps/plugins-workspace"
links = "tauri-plugin-deep-link"
build = "build.rs"

[build-dependencies]
serde = "1"
serde_json = "1"
tauri-utils = "2"
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
plist = "1"

[dependencies]
serde = "1"
serde_json = "1"
tauri = "2"
tauri-utils = "2"
tracing = "0.1"
thiserror = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-registry = "0.6"
windows-result = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "0.21"
